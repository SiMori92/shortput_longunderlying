services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - strategy_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      MONITOR_HOST: ${MONITOR_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  strategy_data:
  caddy_data:
  caddy_config:
